<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VR 植木鉢スマッシュ</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: 'Inter', sans-serif;
        }
        #info {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: white;
            pointer-events: none;
            z-index: 100;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
        }
        h2 { margin: 0 0 10px 0; font-size: 24px; }
        p { margin: 0; font-size: 14px; opacity: 0.9; }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
            }
        }
    </script>
</head>
<body>
    <div id="info">
        <h2>VR 植木鉢スマッシュ</h2>
        <p>VRを起動し、コントローラーのグリップボタン、またはハンドトラッキング（手をグーに握る）で鉢を掴み、壁に投げてください。</p>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { VRButton } from 'three/addons/webxr/VRButton.js';
        import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';
        import { XRHandModelFactory } from 'three/addons/webxr/XRHandModelFactory.js';
        import * as CANNON from 'cannon-es';

        // --- Global Variables ---
        let scene, camera, renderer;
        let world;
        let potGroup, potBody, plantGroup;
        let controllers = [];
        let hands = [];
        let grabbedBy = null;
        let grabLocalOffset = new THREE.Matrix4();
        let isBroken = false;
        
        // Physics materials
        let groundMaterial, potMaterial, wallMaterial;
        let potWallContactMaterial, potGroundContactMaterial;

        // Velocity tracking for smooth throws
        const controllersData = new Map();

        // Audio Context for synthesized sounds
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        const clock = new THREE.Clock();

        const debrisBodies = [];
        const debrisMeshes = [];

        // Start application
        init();

        function init() {
            // 1. Scene Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb); // Sky blue
            scene.fog = new THREE.Fog(0x87ceeb, 5, 20);

            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 50);
            camera.position.set(0, 1.6, 2); // Average standing height

            // 2. Renderer Setup
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.xr.enabled = true; // Enable WebXR
            document.body.appendChild(renderer.domElement);
            document.body.appendChild(VRButton.createButton(renderer));

            // 3. Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
            dirLight.position.set(3, 10, 4);
            dirLight.castShadow = true;
            dirLight.shadow.camera.top = 4;
            dirLight.shadow.camera.bottom = -4;
            dirLight.shadow.camera.left = -4;
            dirLight.shadow.camera.right = 4;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            scene.add(dirLight);

            // 4. Physics World (Cannon.js)
            world = new CANNON.World({
                gravity: new CANNON.Vec3(0, -9.82, 0)
            });
            world.broadphase = new CANNON.SAPBroadphase(world);
            world.solver.iterations = 20;

            // Physics Materials Setup
            groundMaterial = new CANNON.Material('ground');
            potMaterial = new CANNON.Material('pot');
            wallMaterial = new CANNON.Material('wall');

            potGroundContactMaterial = new CANNON.ContactMaterial(groundMaterial, potMaterial, {
                friction: 0.5,
                restitution: 0.1 // 弾まない
            });
            potWallContactMaterial = new CANNON.ContactMaterial(wallMaterial, potMaterial, {
                friction: 0.4,
                restitution: 0.1
            });
            world.addContactMaterial(potGroundContactMaterial);
            world.addContactMaterial(potWallContactMaterial);

            // Create Objects
            createEnvironment();
            spawnPot();
            setupVRInputs();

            window.addEventListener('resize', onWindowResize);

            // Start Animation Loop
            renderer.setAnimationLoop(animate);
        }

        function createEnvironment() {
            // Visual Floor
            const floorGeo = new THREE.PlaneGeometry(20, 20);
            const floorMat = new THREE.MeshStandardMaterial({ 
                color: 0x335533, 
                roughness: 0.9, 
                metalness: 0.1 
            });
            const floorMesh = new THREE.Mesh(floorGeo, floorMat);
            floorMesh.rotation.x = -Math.PI / 2;
            floorMesh.receiveShadow = true;
            scene.add(floorMesh);

            // Physics Floor
            const floorBody = new CANNON.Body({
                type: CANNON.Body.STATIC,
                shape: new CANNON.Plane(),
                material: groundMaterial
            });
            floorBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
            world.addBody(floorBody);

            // Wall (Target to smash)
            const wallGeo = new THREE.BoxGeometry(10, 4, 0.5);
            const wallMat = new THREE.MeshStandardMaterial({ color: 0xdddddd, roughness: 1.0 });
            const wallMesh = new THREE.Mesh(wallGeo, wallMat);
            wallMesh.position.set(0, 2, -3);
            wallMesh.receiveShadow = true;
            wallMesh.castShadow = true;
            scene.add(wallMesh);

            const wallBody = new CANNON.Body({
                type: CANNON.Body.STATIC,
                shape: new CANNON.Box(new CANNON.Vec3(5, 2, 0.25)),
                position: new CANNON.Vec3(0, 2, -3),
                material: wallMaterial
            });
            world.addBody(wallBody);

            // Pedestal (Table)
            const pedGeo = new THREE.CylinderGeometry(0.3, 0.3, 1, 32);
            const pedMat = new THREE.MeshStandardMaterial({ color: 0x555555 });
            const pedMesh = new THREE.Mesh(pedGeo, pedMat);
            pedMesh.position.set(0, 0.5, -0.5);
            pedMesh.receiveShadow = true;
            pedMesh.castShadow = true;
            scene.add(pedMesh);

            // 台座の物理形状はCylinder同士の衝突計算バグを避けるためBoxで近似
            const pedBody = new CANNON.Body({
                type: CANNON.Body.STATIC,
                shape: new CANNON.Box(new CANNON.Vec3(0.3, 0.5, 0.3)), // (width/2, height/2, depth/2)
                position: new CANNON.Vec3(0, 0.5, -0.5)
            });
            world.addBody(pedBody);
        }

        function spawnPot() {
            isBroken = false;
            grabbedBy = null;
            
            potGroup = new THREE.Group();
            
            // Ceramic Material
            const ceramicMat = new THREE.MeshStandardMaterial({ 
                color: 0xcc6633, // Terracotta
                roughness: 0.7, 
                metalness: 0.1 
            });

            // Pot Shape
            const potGeo = new THREE.CylinderGeometry(0.15, 0.1, 0.2, 16);
            const potMesh = new THREE.Mesh(potGeo, ceramicMat);
            potMesh.castShadow = true;
            potGroup.add(potMesh);

            // Soil Shape
            const soilGeo = new THREE.CylinderGeometry(0.14, 0.14, 0.05, 16);
            const soilMat = new THREE.MeshStandardMaterial({ color: 0x2b1d14, roughness: 1.0 });
            const soilMesh = new THREE.Mesh(soilGeo, soilMat);
            soilMesh.position.y = 0.08;
            potGroup.add(soilMesh);

            // Procedural Plant Shape (Realistic Succulent/Sansevieria style)
            plantGroup = new THREE.Group();
            const plantMat = new THREE.MeshStandardMaterial({ color: 0x3b5e2b, roughness: 0.9 }); // 深い緑
            const numLeaves = 8;
            for (let i = 0; i < numLeaves; i++) {
                const h = 0.15 + Math.random() * 0.15;
                // 先端が細く根本が太い円錐をベースにする
                const leafGeo = new THREE.CylinderGeometry(0, 0.025, h, 6);
                leafGeo.scale(1, 1, 0.2); // Z軸を潰して平べったい「葉」の形にする
                leafGeo.translate(0, h / 2, 0); // 回転軸を葉の根本（下端）にずらす
                
                const leaf = new THREE.Mesh(leafGeo, plantMat);
                
                // 放射状に配置
                const angle = (i / numLeaves) * Math.PI * 2 + (Math.random() * 0.5);
                leaf.rotation.y = angle;
                // 外側に向かって少し倒す
                leaf.rotation.x = 0.15 + Math.random() * 0.3; 
                
                // 根本を中心からわずかに散らす
                leaf.position.set(Math.sin(angle) * 0.02, 0, Math.cos(angle) * 0.02);
                plantGroup.add(leaf);
            }

            plantGroup.position.y = 0.1; 
            potGroup.add(plantGroup);

            // 初期位置を少し高くして確実に台座に着地（めり込みを防止）
            potGroup.position.set(0, 1.15, -0.5);
            scene.add(potGroup);

            // Create Physics Body (Cylinder)
            const shape = new CANNON.Cylinder(0.15, 0.1, 0.2, 16);
            potBody = new CANNON.Body({
                mass: 1.5, // 1.5kg
                material: potMaterial,
                position: new CANNON.Vec3(0, 1.15, -0.5)
            });
            potBody.addShape(shape, new CANNON.Vec3(0,0,0), new CANNON.Quaternion().setFromEuler(-Math.PI/2, 0, 0));
            
            potBody.addEventListener("collide", handleCollision);
            world.addBody(potBody);
        }

        function playShatterSound(velocity) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const masterGain = audioCtx.createGain();
            const impactForce = Math.min(Math.max(velocity / 15, 0.2), 1.0);
            masterGain.gain.value = impactForce;
            masterGain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            // 1. Low Frequency Thud (Impact)
            const oscThud = audioCtx.createOscillator();
            const gainThud = audioCtx.createGain();
            oscThud.type = 'sine';
            oscThud.frequency.setValueAtTime(150, now);
            oscThud.frequency.exponentialRampToValueAtTime(40, now + 0.1);
            gainThud.gain.setValueAtTime(1, now);
            gainThud.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            oscThud.connect(gainThud).connect(masterGain);
            oscThud.start(now);
            oscThud.stop(now + 0.1);

            // 2. High Frequency Ceramic Crack (Inharmonic multi-oscillators)
            const frequencies = [800, 1200, 2400, 3100, 4500, 6000];
            frequencies.forEach((freq, index) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = index % 2 === 0 ? 'sine' : 'square';
                osc.frequency.value = freq + (Math.random() * 200 - 100); 
                
                const decay = 0.05 + (Math.random() * 0.1); 
                gain.gain.setValueAtTime(0.8 / frequencies.length, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + decay);
                
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = freq;
                filter.Q.value = 5;

                osc.connect(filter).connect(gain).connect(masterGain);
                osc.start(now);
                osc.stop(now + decay);
            });

            // 3. Debris Scatter Noise
            const bufferSize = audioCtx.sampleRate * 0.3; // 0.3 seconds
            const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = noiseBuffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                output[i] = Math.random() * 2 - 1;
            }
            const noiseSource = audioCtx.createBufferSource();
            noiseSource.buffer = noiseBuffer;
            
            const noiseFilter = audioCtx.createBiquadFilter();
            noiseFilter.type = 'highpass';
            noiseFilter.frequency.value = 2000;

            const noiseGain = audioCtx.createGain();
            noiseGain.gain.setValueAtTime(0.5, now);
            noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);

            noiseSource.connect(noiseFilter).connect(noiseGain).connect(masterGain);
            noiseSource.start(now);
        }

        function handleCollision(e) {
            if (isBroken || grabbedBy) return;

            const relativeVelocity = e.contact.getImpactVelocityAlongNormal();
            
            // Break if impact velocity is high enough
            if (Math.abs(relativeVelocity) > 2.0) {
                breakPot(Math.abs(relativeVelocity));
            }
        }

        function breakPot(velocity) {
            isBroken = true;
            
            playShatterSound(velocity);

            // Hide original pot and remove physics body
            scene.remove(potGroup);
            world.removeBody(potBody);

            const pos = potBody.position;
            const ceramicMat = new THREE.MeshStandardMaterial({ color: 0xcc6633, roughness: 0.8 });
            const soilMat = new THREE.MeshStandardMaterial({ color: 0x2b1d14, roughness: 1.0 });

            // 1. Generate Ceramic Debris
            for (let i = 0; i < 12; i++) {
                const s = 0.05 + Math.random() * 0.05;
                // 立方体ではなく、四面体を不規則に歪ませて「鋭利な陶器の破片」を表現
                const geo = new THREE.TetrahedronGeometry(s);
                geo.scale(1 + Math.random(), 0.3 + Math.random() * 0.4, 1 + Math.random());
                
                const mesh = new THREE.Mesh(geo, ceramicMat);
                mesh.castShadow = true;
                
                const body = new CANNON.Body({
                    mass: 0.1,
                    shape: new CANNON.Box(new CANNON.Vec3(s/2, s/2, s/2)),
                    position: new CANNON.Vec3(
                        pos.x + (Math.random() - 0.5) * 0.2,
                        pos.y + (Math.random() - 0.5) * 0.2,
                        pos.z + (Math.random() - 0.5) * 0.2
                    ),
                    material: potMaterial
                });
                
                const force = velocity * 0.5;
                body.velocity.set(
                    (Math.random() - 0.5) * force,
                    Math.random() * force * 0.5,
                    (Math.random() - 0.5) * force
                );
                
                scene.add(mesh);
                world.addBody(body);
                debrisMeshes.push(mesh);
                debrisBodies.push(body);
            }

            // 2. Generate Soil Debris
            for (let i = 0; i < 20; i++) {
                const s = 0.02 + Math.random() * 0.03;
                // 立方体ではなく、十二面体を少し潰して「ゴツゴツした土塊」を表現
                const geo = new THREE.DodecahedronGeometry(s * 0.8);
                geo.scale(1, 0.8 + Math.random() * 0.4, 1);

                const mesh = new THREE.Mesh(geo, soilMat);
                mesh.castShadow = true;
                
                const body = new CANNON.Body({
                    mass: 0.05,
                    shape: new CANNON.Box(new CANNON.Vec3(s/2, s/2, s/2)),
                    position: new CANNON.Vec3(
                        pos.x + (Math.random() - 0.5) * 0.15,
                        pos.y + 0.1 + (Math.random() - 0.5) * 0.1,
                        pos.z + (Math.random() - 0.5) * 0.15
                    )
                });
                
                body.velocity.set(
                    (Math.random() - 0.5) * velocity * 0.3,
                    Math.random() * velocity * 0.3,
                    (Math.random() - 0.5) * velocity * 0.3
                );
                
                scene.add(mesh);
                world.addBody(body);
                debrisMeshes.push(mesh);
                debrisBodies.push(body);
            }

            // 3. Drop Plant as Physics Object
            const plantBody = new CANNON.Body({
                mass: 0.2,
                shape: new CANNON.Sphere(0.08),
                position: new CANNON.Vec3(pos.x, pos.y + 0.1, pos.z)
            });
            plantBody.velocity.set(
                (Math.random() - 0.5) * velocity * 0.2,
                Math.random() * velocity * 0.2,
                (Math.random() - 0.5) * velocity * 0.2
            );
            world.addBody(plantBody);
            scene.add(plantGroup); 
            
            debrisMeshes.push(plantGroup);
            debrisBodies.push(plantBody);

            // 4. Cleanup and respawn after 5 seconds
            setTimeout(() => {
                cleanupDebris();
                spawnPot();
            }, 5000);
        }

        function cleanupDebris() {
            for (let i = 0; i < debrisMeshes.length; i++) {
                scene.remove(debrisMeshes[i]);
                world.removeBody(debrisBodies[i]);
            }
            debrisMeshes.length = 0;
            debrisBodies.length = 0;
        }

        function setupVRInputs() {
            const controllerModelFactory = new XRControllerModelFactory();
            const handModelFactory = new XRHandModelFactory();

            for (let i = 0; i < 2; i++) {
                // Controller Setup
                const controller = renderer.xr.getController(i);
                scene.add(controller);
                controllers.push(controller);

                const grip = renderer.xr.getControllerGrip(i);
                grip.add(controllerModelFactory.createControllerModel(grip));
                scene.add(grip);

                // Hand Tracking Setup
                const hand = renderer.xr.getHand(i);
                hand.add(handModelFactory.createHandModel(hand, 'mesh')); 
                scene.add(hand);
                hands.push(hand);

                // Initialize velocity tracking data
                controllersData.set(controller, {
                    positions: [],
                    quaternions: [],
                    times: []
                });
                
                // Fallback: Controller Button events
                controller.addEventListener('selectstart', () => doGrabStart(controller));
                controller.addEventListener('squeeze', () => doGrabStart(controller));
                
                controller.addEventListener('selectend', () => doGrabEnd(controller));
                controller.addEventListener('squeezeend', () => doGrabEnd(controller));
            }
        }

        function doGrabStart(controller) {
            if (isBroken || grabbedBy) return;

            const cPos = new THREE.Vector3();
            controller.getWorldPosition(cPos);
            const pPos = new THREE.Vector3();
            potGroup.getWorldPosition(pPos);

            // Allow grabbing if distance is within 35cm (accommodates palms)
            if (cPos.distanceTo(pPos) < 0.35) {
                grabbedBy = controller;
                world.removeBody(potBody); 
                
                const controllerInverse = new THREE.Matrix4().copy(controller.matrixWorld).invert();
                grabLocalOffset.multiplyMatrices(controllerInverse, potGroup.matrixWorld);
                
                triggerHaptic(controller, 0.3, 50);
            }
        }

        function doGrabEnd(controller) {
            if (grabbedBy === controller) {
                grabbedBy = null;
                
                potBody.position.copy(potGroup.position);
                potBody.quaternion.copy(potGroup.quaternion);

                const { velocity, angularVelocity } = getSmoothVelocity(controller);
                
                potBody.velocity.set(velocity.x * 2.5, velocity.y * 2.5, velocity.z * 2.5);
                potBody.angularVelocity.set(angularVelocity.x, angularVelocity.y, angularVelocity.z);
                
                world.addBody(potBody); 
            }
        }

        function checkHandGestures() {
            for (let i = 0; i < 2; i++) {
                const hand = hands[i];
                const controller = controllers[i];
                if (!hand || !hand.joints) continue;
                
                const wrist = hand.joints['wrist'];
                const indexTip = hand.joints['index-finger-tip'];
                const middleTip = hand.joints['middle-finger-tip'];
                const ringTip = hand.joints['ring-finger-tip'];

                if (wrist && indexTip && middleTip && ringTip) {
                    const wp = new THREE.Vector3().setFromMatrixPosition(wrist.matrixWorld);
                    const ip = new THREE.Vector3().setFromMatrixPosition(indexTip.matrixWorld);
                    const mp = new THREE.Vector3().setFromMatrixPosition(middleTip.matrixWorld);
                    const rp = new THREE.Vector3().setFromMatrixPosition(ringTip.matrixWorld);

                    const distI = wp.distanceTo(ip);
                    const distM = wp.distanceTo(mp);
                    const distR = wp.distanceTo(rp);

                    const avgDist = (distI + distM + distR) / 3.0;

                    // Fist gesture: distance between wrist and fingertips is less than 8cm
                    const isGripping = avgDist < 0.08;

                    if (isGripping && !hand.userData.isGripping) {
                        hand.userData.isGripping = true;
                        doGrabStart(controller);
                    } else if (!isGripping && hand.userData.isGripping) {
                        hand.userData.isGripping = false;
                        doGrabEnd(controller);
                    }
                }
            }
        }

        function triggerHaptic(controller, intensity, duration) {
            const session = renderer.xr.getSession();
            if (session && controller.userData.inputSource && controller.userData.inputSource.gamepad) {
                const hapticActuator = controller.userData.inputSource.gamepad.hapticActuators[0];
                if (hapticActuator) {
                    hapticActuator.pulse(intensity, duration);
                }
            }
        }

        function updateControllersVelocity() {
            const now = performance.now();
            controllers.forEach(controller => {
                const data = controllersData.get(controller);
                const pos = new THREE.Vector3();
                const quat = new THREE.Quaternion();
                controller.getWorldPosition(pos);
                controller.getWorldQuaternion(quat);

                data.positions.push(pos);
                data.quaternions.push(quat);
                data.times.push(now);

                // Keep only last 100ms of data for a smooth rolling average
                while(data.times.length > 0 && now - data.times[0] > 100) {
                    data.positions.shift();
                    data.quaternions.shift();
                    data.times.shift();
                }
            });
        }

        function getSmoothVelocity(controller) {
            const data = controllersData.get(controller);
            if (data.times.length < 2) {
                return { velocity: new THREE.Vector3(), angularVelocity: new THREE.Vector3() };
            }

            const pStart = data.positions[0];
            const pEnd = data.positions[data.positions.length - 1];
            const tStart = data.times[0];
            const tEnd = data.times[data.times.length - 1];
            
            const dt = (tEnd - tStart) / 1000; 
            if (dt === 0) return { velocity: new THREE.Vector3(), angularVelocity: new THREE.Vector3() };

            const velocity = new THREE.Vector3().subVectors(pEnd, pStart).divideScalar(dt);
            
            const qStart = data.quaternions[0];
            const qEnd = data.quaternions[data.quaternions.length - 1];
            const qInv = qStart.clone().invert();
            const qDelta = qEnd.clone().multiply(qInv);
            const axis = new THREE.Vector3(qDelta.x, qDelta.y, qDelta.z);
            const angle = 2 * Math.acos(qDelta.w);
            let angularVelocity = new THREE.Vector3();
            
            if(angle > 0.001) {
                axis.normalize();
                angularVelocity.copy(axis).multiplyScalar(angle / dt);
            }

            return { velocity, angularVelocity };
        }

        function animate() {
            const dt = Math.min(clock.getDelta(), 0.1); 

            checkHandGestures();
            updateControllersVelocity();

            // Step physics world
            world.step(1 / 60, dt, 3);

            if (!isBroken) {
                if (grabbedBy) {
                    const tempMatrix = new THREE.Matrix4();
                    tempMatrix.multiplyMatrices(grabbedBy.matrixWorld, grabLocalOffset);
                    potGroup.position.setFromMatrixPosition(tempMatrix);
                    potGroup.quaternion.setFromRotationMatrix(tempMatrix);
                } else {
                    potGroup.position.copy(potBody.position);
                    potGroup.quaternion.copy(potBody.quaternion);
                }
            }

            // Sync debris meshes with physics bodies
            for (let i = 0; i < debrisMeshes.length; i++) {
                debrisMeshes[i].position.copy(debrisBodies[i].position);
                debrisMeshes[i].quaternion.copy(debrisBodies[i].quaternion);
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
